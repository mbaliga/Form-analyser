name: Validate Lancaster-grounded arrow taxonomy

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - tools/atelier/build_arrow_reference_library.py
      - tools/atelier/test_arrow_reference_library.py
      - tools/atelier/verify_arrow_reference_browser.mjs
      - tools/atelier/build_assets.py
      - app-android/src/main/assets/atelier/index.html
      - app-android/src/main/assets/atelier/atelier.js
      - app-android/src/main/assets/atelier/atelier.css
      - docs/crocodyl/visuals/LANCASTER_ARROW_REFERENCE_LEDGER.md
      - .github/workflows/bake-arrow-reference-library.yml
  pull_request:
    paths:
      - tools/atelier/build_arrow_reference_library.py
      - tools/atelier/test_arrow_reference_library.py
      - tools/atelier/verify_arrow_reference_browser.mjs
      - tools/atelier/build_assets.py
      - app-android/src/main/assets/atelier/index.html
      - app-android/src/main/assets/atelier/atelier.js
      - app-android/src/main/assets/atelier/atelier.css
      - docs/crocodyl/visuals/LANCASTER_ARROW_REFERENCE_LEDGER.md
      - .github/workflows/bake-arrow-reference-library.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arrow-reference-library-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Build taxonomy GLBs
        run: python3 tools/atelier/build_arrow_reference_library.py
      - name: Validate taxonomy contracts
        run: python3 tools/atelier/test_arrow_reference_library.py
      - name: Reject generated-asset drift
        run: git diff --exit-code -- app-android/src/main/assets/atelier/arrow-reference-library
      - name: Exercise all reference families in Chromium/WebGL
        run: xvfb-run -a node tools/atelier/verify_arrow_reference_browser.mjs
      - name: Upload inspectable library and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crocodyl-arrow-reference-library-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            app-android/src/main/assets/atelier/arrow-reference-library/
            docs/crocodyl/visuals/LANCASTER_ARROW_REFERENCE_LEDGER.md
            docs/crocodyl/arrow-reference-previews/
            tools/atelier/build_arrow_reference_library.py
            tools/atelier/verify_arrow_reference_browser.mjs
          if-no-files-found: error
