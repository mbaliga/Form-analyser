name: reproducible

# F-Droid publishes our signed APK only if its own rebuild of the tag is byte-identical to the
# unsigned release. Build the unsigned release twice from separate clean checkouts and compare.
on:
  pull_request:
    paths:
      - "app-android/**"
      - "*.gradle.kts"
      - "gradle/**"
      - ".github/workflows/reproducible.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  unsigned-release:
    runs-on: ubuntu-24.04
    env:
      UNSIGNED_APK: app-android/build/outputs/apk/release/app-android-release-unsigned.apk
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: build-a
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: build-b
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - name: Build the unsigned release (first checkout)
        working-directory: build-a
        run: ./gradlew -PwithAndroid :app-android:assembleRelease --no-build-cache --no-daemon
      - name: Build the unsigned release (second checkout)
        working-directory: build-b
        run: ./gradlew -PwithAndroid :app-android:assembleRelease --no-build-cache --no-daemon
      - name: Compare the two APKs byte for byte
        id: compare
        run: |
          sha256sum "build-a/$UNSIGNED_APK" "build-b/$UNSIGNED_APK"
          cmp "build-a/$UNSIGNED_APK" "build-b/$UNSIGNED_APK"
      - name: Explain the difference
        if: failure() && steps.compare.outcome == 'failure'
        run: |
          python3 -m venv "$RUNNER_TEMP/diffoscope-venv"
          "$RUNNER_TEMP/diffoscope-venv/bin/pip" install --disable-pip-version-check diffoscope
          mkdir -p diffoscope-report
          "$RUNNER_TEMP/diffoscope-venv/bin/diffoscope" --html diffoscope-report/index.html \
            "build-a/$UNSIGNED_APK" "build-b/$UNSIGNED_APK" || true
      - name: Upload the difference report
        if: failure() && steps.compare.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reproducibility-diffoscope-report
          path: diffoscope-report
          if-no-files-found: warn
          retention-days: 14
