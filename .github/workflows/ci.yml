name: ci

on:
  push:
    paths:
      - "engine/**"
      - "archery-module/**"
      - "fencing-module/**"
      # `./gradlew test` covers every pure-JVM module, but this workflow only fired for the two
      # above — so the core-* suites (scoring, athlete, wellness, coach, equipment, exchange, body)
      # never ran in CI at all.
      - "core-*/**"
      - "settings.gradle.kts"
      # app-android is not built here (no SDK), but PrivacyRegistryTest reads its migration DDL to
      # assert every Room table is classified. Adding a table only touches app-android, so without
      # this path that test could never fire on the very change it exists to catch.
      - "app-android/**"
      - "docs/crocodyl/community-directory/**"
      - "tools/community_directory/**"
      - "tools/release/**"
      - "tools/web_viewer/**"
      - "web-viewer/**"
      - ".github/workflows/**"
      - "*.gradle.kts"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "engine/**"
      - "archery-module/**"
      - "fencing-module/**"
      # `./gradlew test` covers every pure-JVM module, but this workflow only fired for the two
      # above — so the core-* suites (scoring, athlete, wellness, coach, equipment, exchange, body)
      # never ran in CI at all.
      - "core-*/**"
      - "settings.gradle.kts"
      # app-android is not built here (no SDK), but PrivacyRegistryTest reads its migration DDL to
      # assert every Room table is classified. Adding a table only touches app-android, so without
      # this path that test could never fire on the very change it exists to catch.
      - "app-android/**"
      - "docs/crocodyl/community-directory/**"
      - "tools/community_directory/**"
      - "tools/release/**"
      - "tools/web_viewer/**"
      - "web-viewer/**"
      - ".github/workflows/**"
      - "*.gradle.kts"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      # Self-contained: builds the engine module and the archery module together.
      - name: Test
        run: ./gradlew test --no-daemon
      - name: Validate community directory contracts
        run: python3 -m unittest discover -s tools/community_directory -p 'test_*.py'
      - name: Verify immutable workflow action refs
        run: python3 tools/release/verify_workflow_actions.py
      - name: Validate offline desktop viewer contract
        run: python3 -m unittest discover -s tools/web_viewer -p 'test_*.py'
