name: android

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "archery-module/**"
      - "fencing-module/**"
      - "muaythai-module/**"
      - "bouldering-module/**"
      - "core-*/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "app-android/**"
      - "*.gradle.kts"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "engine/**"
      - "archery-module/**"
      - "fencing-module/**"
      - "muaythai-module/**"
      - "bouldering-module/**"
      - "core-*/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "app-android/**"
      - "*.gradle.kts"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      # setup-android's default package list includes Google's removed `tools` package; AGP
      # downloads the required platforms/build-tools, so install only platform-tools here.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      # -PwithAndroid opts :app-android into the build (see settings.gradle.kts).
      - name: Run JVM unit tests
        run: ./gradlew test --no-daemon
      - name: Run Android unit tests
        run: ./gradlew :app-android:testDebugUnitTest :app-android:testReleaseUnitTest -PwithAndroid --no-daemon --console=plain 2>&1 | tee android-unit-tests.log
      - name: Annotate Android unit test failure
        if: failure()
        run: |
          # Surface the Gradle failure in check-run annotations (job logs are not always reachable).
          {
            grep -E '^e: |^w: .*error|FAILED$|What went wrong' -A4 android-unit-tests.log || tail -n 40 android-unit-tests.log
          } | head -n 40 | sed 's/$/%0A/' | tr -d '\n' | sed 's/^/::error title=Android unit tests::/'
          echo
      - name: Run Android lint
        run: |
          ./gradlew :app-android:lintRelease -PwithAndroid --no-daemon --console=plain 2>&1 | tee lint.log
          exit "${PIPESTATUS[0]}"
      - name: Annotate Android lint findings
        if: failure()
        run: |
          # Surface the Gradle failure block (when lint never ran) as check-run annotations.
          # GitHub keeps only 10 annotations per step, so bundle each group into one message.
          grep -v '^> Task' lint.log > lint.filtered.log || true
          annotate() { # $1 = title, stdin = lines
            local body
            body="$(cut -c1-300 | head -n 25 | sed 's/%/%25/g' | sed 's/$/%0A/' | tr -d '\n')"
            [ -n "$body" ] && echo "::error title=$1::$body" || true
          }
          grep -E '^e: ' lint.filtered.log | annotate "Kotlin compile errors"
          grep -A8 'What went wrong' lint.filtered.log | annotate "Gradle: what went wrong"
          grep -E 'Caused by|Could not|Unresolved reference|error:' lint.filtered.log | awk '!seen[$0]++' | annotate "Gradle: causes"
          { echo '### lintRelease output (last 300 lines)'; echo '```'; tail -n 300 lint.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Dependency verification names the artifact it lacks a checksum for; print what Google
          # Maven serves for the Linux aapt2 jar so the checksum can be reviewed and committed.
          for artifact in aapt2-8.13.2-14304508-linux.jar; do
            curl -fsSL "https://dl.google.com/dl/android/maven2/com/android/tools/build/aapt2/8.13.2-14304508/$artifact" -o "/tmp/$artifact" \
              && echo "::error title=sha256 $artifact::$(sha256sum "/tmp/$artifact" | cut -d' ' -f1)" || true
          done
          # Surface lint issues as check-run annotations (job logs are not always reachable).
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          files = glob.glob("app-android/build/reports/lint-results-*.xml")
          if not files:
              print("::error title=Android lint::no lint XML report found (build failed before lint reported)")
          for report in files:
              count = 0
              for issue in ET.parse(report).getroot().iter("issue"):
                  if issue.get("severity") not in ("Error", "Fatal"):
                      continue
                  loc = issue.find("location")
                  path = loc.get("file", "") if loc is not None else ""
                  line = loc.get("line", "1") if loc is not None else "1"
                  msg = " ".join((issue.get("message") or "").split())
                  print(f"::error file={path},line={line}::{issue.get('id')}: {msg}"[:900])
                  count += 1
                  if count >= 40:
                      break
          PY
      - name: Run on-device Android smoke tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew :app-android:connectedDebugAndroidTest -PwithAndroid --no-daemon
      - name: Run debug smoke tests on Android 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew :app-android:connectedDebugAndroidTest -PwithAndroid --no-daemon
      - name: Run debug smoke tests on 16 KB page-size emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis_ps16k
          arch: x86_64
          profile: Pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            page_size="$(adb shell getconf PAGE_SIZE | tr -d '\r')"
            test "$page_size" = 16384 || { echo "Expected 16 KB pages, got $page_size" >&2; exit 1; }
            adb shell settings put system font_scale 1.3
            font_scale="$(adb shell settings get system font_scale | tr -d '\r')"
            test "$font_scale" = 1.3 || { echo "Expected font scale 1.3, got $font_scale" >&2; exit 1; }
            ./gradlew :app-android:connectedDebugAndroidTest -PwithAndroid --no-daemon
      - name: Collect Android debug instrumentation diagnostics
        if: always()
        run: |
          mkdir -p app-android/build/diagnostics
          timeout 30 adb logcat -d -v threadtime > app-android/build/diagnostics/debug-logcat.txt 2>&1 || true
      - name: Upload Android debug test reports and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crocodyl-android-debug-test-reports
          path: |
            app-android/build/test-results/**
            app-android/build/outputs/androidTest-results/connected/debug/**
            app-android/build/reports/androidTests/connected/debug/**
            app-android/build/diagnostics/debug-logcat.txt
          if-no-files-found: warn
      - name: Assemble debug APK
        run: ./gradlew :app-android:assembleDebug -PwithAndroid --no-daemon
      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: form-analyser-android-test-results
          path: app-android/build/test-results/testDebugUnitTest/**
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: form-analyser-debug
          path: app-android/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
