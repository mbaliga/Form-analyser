name: android

on:
  push:
    paths:
      - "engine/**"
      - "archery-module/**"
      - "fencing-module/**"
      - "core-*/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "app-android/**"
      - "*.gradle.kts"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "engine/**"
      - "archery-module/**"
      - "fencing-module/**"
      - "core-*/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "app-android/**"
      - "*.gradle.kts"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      # ubuntu-latest ships an Android SDK; this ensures cmdline-tools + accepted licenses
      # so AGP can fetch any missing platform/build-tools.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      # -PwithAndroid opts :app-android into the build (see settings.gradle.kts).
      - name: Run JVM unit tests
        run: ./gradlew test --no-daemon
      - name: Run Android unit tests
        run: ./gradlew :app-android:testDebugUnitTest :app-android:testReleaseUnitTest -PwithAndroid --no-daemon
      - name: Run Android lint
        run: ./gradlew :app-android:lintRelease -PwithAndroid --no-daemon
      - name: Run on-device Android smoke tests
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew :app-android:connectedDebugAndroidTest -PwithAndroid --no-daemon
      - name: Assemble debug APK
        run: ./gradlew :app-android:assembleDebug -PwithAndroid --no-daemon
      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: form-analyser-android-test-results
          path: app-android/build/test-results/testDebugUnitTest/**
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: form-analyser-debug
          path: app-android/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
