name: android

on:
  push:
    paths:
      - "engine/**"
      - "archery-module/**"
      - "fencing-module/**"
      - "muaythai-module/**"
      - "bouldering-module/**"
      - "core-*/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "app-android/**"
      - "*.gradle.kts"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "engine/**"
      - "archery-module/**"
      - "fencing-module/**"
      - "muaythai-module/**"
      - "bouldering-module/**"
      - "core-*/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "app-android/**"
      - "*.gradle.kts"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      # ubuntu-latest ships an Android SDK; this ensures cmdline-tools + accepted licenses
      # so AGP can fetch any missing platform/build-tools.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      # -PwithAndroid opts :app-android into the build (see settings.gradle.kts).
      - name: Run JVM unit tests
        run: ./gradlew test --no-daemon
      - name: Run Android unit tests
        run: ./gradlew :app-android:testDebugUnitTest :app-android:testReleaseUnitTest -PwithAndroid --no-daemon
      - name: Run Android lint
        run: ./gradlew :app-android:lintRelease -PwithAndroid --no-daemon
      - name: Run on-device Android smoke tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew :app-android:connectedDebugAndroidTest -PwithAndroid --no-daemon
      - name: Run debug smoke tests on 16 KB page-size emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis_ps16k
          arch: x86_64
          profile: Pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            page_size="$(adb shell getconf PAGE_SIZE | tr -d '\r')"
            test "$page_size" = 16384 || { echo "Expected 16 KB pages, got $page_size" >&2; exit 1; }
            adb shell settings put system font_scale 1.3
            font_scale="$(adb shell settings get system font_scale | tr -d '\r')"
            test "$font_scale" = 1.3 || { echo "Expected font scale 1.3, got $font_scale" >&2; exit 1; }
            ./gradlew :app-android:connectedDebugAndroidTest -PwithAndroid --no-daemon
      - name: Collect Android debug instrumentation diagnostics
        if: always()
        run: |
          mkdir -p app-android/build/diagnostics
          adb logcat -d -v threadtime > app-android/build/diagnostics/debug-logcat.txt 2>&1 || true
      - name: Upload Android debug test reports and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crocodyl-android-debug-test-reports
          path: |
            app-android/build/test-results/**
            app-android/build/outputs/androidTest-results/connected/debug/**
            app-android/build/reports/androidTests/connected/debug/**
            app-android/build/diagnostics/debug-logcat.txt
          if-no-files-found: warn
      - name: Assemble debug APK
        run: ./gradlew :app-android:assembleDebug -PwithAndroid --no-daemon
      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: form-analyser-android-test-results
          path: app-android/build/test-results/testDebugUnitTest/**
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: form-analyser-debug
          path: app-android/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
