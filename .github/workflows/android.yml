name: android

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "archery-module/**"
      - "app-android/**"
      - "tools/atelier/**"
      - "*.gradle.kts"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "engine/**"
      - "archery-module/**"
      - "app-android/**"
      - "tools/atelier/**"
      - "*.gradle.kts"
      - ".github/workflows/android.yml"

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      # Bake before assembly so even a source-only checkout contains the exact same assets.
      # Pure Python stdlib; no renderer download and no runtime network dependency.
      - name: Bake and validate original equipment assets
        run: |
          python3 tools/atelier/build_assets.py
          python3 tools/atelier/test_assets.py
      - name: Assemble debug APK
        run: ./gradlew :app-android:assembleDebug -PwithAndroid --no-daemon
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: form-analyser-debug
          path: app-android/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
