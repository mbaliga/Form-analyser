name: android

on:
  push:
    paths:
      - "engine/**"
      - "archery-module/**"
      - "core-*/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "app-android/**"
      - "*.gradle.kts"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "engine/**"
      - "archery-module/**"
      - "core-*/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "app-android/**"
      - "*.gradle.kts"
      - ".github/workflows/android.yml"

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # ubuntu-latest ships an Android SDK; this ensures cmdline-tools + accepted licenses
      # so AGP can fetch any missing platform/build-tools.
      - uses: android-actions/setup-android@v3
      # -PwithAndroid opts :app-android into the build (see settings.gradle.kts).
      - name: Run JVM unit tests
        run: ./gradlew test --no-daemon
      - name: Run Android unit tests
        run: ./gradlew :app-android:testDebugUnitTest :app-android:testReleaseUnitTest -PwithAndroid --no-daemon
      - name: Run Android lint
        run: ./gradlew :app-android:lintRelease -PwithAndroid --no-daemon
      - name: Run on-device Android smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew :app-android:connectedDebugAndroidTest -PwithAndroid --no-daemon
      - name: Assemble debug APK
        run: ./gradlew :app-android:assembleDebug -PwithAndroid --no-daemon
      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: form-analyser-android-test-results
          path: app-android/build/test-results/testDebugUnitTest/**
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: form-analyser-debug
          path: app-android/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
