name: release

on:
  push:
    tags:
      - "v*"
    # The session's git proxy can't push tags and the integration can't dispatch workflows,
    # so a `release/<version>` branch (creatable via the API) is the trigger of record: the
    # workflow derives the version from the branch name and softprops creates tag + Release.
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create (e.g. v0.4.0-hyle-approx)"
        required: true
      versionCode:
        description: "Optional Android versionCode for non-semver release names"
        required: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Verify production signing inputs
        env:
          KEYSTORE_BASE64: ${{ secrets.CROCODYL_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CROCODYL_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CROCODYL_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CROCODYL_RELEASE_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.CROCODYL_RELEASE_CERT_SHA256 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          NORMALIZED_CERT="$(printf '%s' "$CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$NORMALIZED_CERT" | grep -Eq '^[0-9a-f]{64}$'
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.CROCODYL_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app-android/release.keystore
          chmod 600 app-android/release.keystore
      - name: Resolve version name
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.versionCode }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          RAW="${INPUT_VERSION:-$REF_NAME}"
          VERSION="${RAW#release/}"
          if [[ "$VERSION" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)([-+].*)?$ ]]; then
            MAJOR="${BASH_REMATCH[1]#0}"
            MINOR="${BASH_REMATCH[2]#0}"
            PATCH="${BASH_REMATCH[3]#0}"
            MAJOR="${MAJOR:-0}"
            MINOR="${MINOR:-0}"
            PATCH="${PATCH:-0}"
            VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          elif [[ "$INPUT_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            VERSION_CODE="$INPUT_VERSION_CODE"
          else
            echo "A semver release name or a positive versionCode input is required." >&2
            exit 1
          fi
          if (( VERSION_CODE < 1 || VERSION_CODE > 2100000000 )); then
            echo "Derived versionCode is outside Android's supported range: $VERSION_CODE" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Run Android unit tests
        run: ./gradlew :app-android:testDebugUnitTest :app-android:testReleaseUnitTest -PwithAndroid --no-daemon
      - name: Run JVM unit tests
        run: ./gradlew test --no-daemon
      - name: Run Android lint
        run: ./gradlew :app-android:lintRelease -PwithAndroid --no-daemon
      - name: Run on-device Android smoke tests
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew :app-android:connectedDebugAndroidTest -PwithAndroid --no-daemon -PcrocodylVersionName="${{ steps.ver.outputs.version }}" -PcrocodylVersionCode="${{ steps.ver.outputs.version_code }}"
      - name: Validate packaged equipment source contracts
        run: |
          python3 tools/release/verify_workflow_actions.py
          python3 -m unittest discover -s tools/release -p 'test_*.py'
          python3 -m unittest discover -s tools/web_viewer -p 'test_*.py'
          node tools/web_viewer/test_signature_interop.mjs
          python3 -m unittest discover -s tools/community_directory -p 'test_*.py'
          python3 tools/community_directory/validate_directory.py docs/crocodyl/community-directory/entries
          python3 tools/atelier/test_assets.py
          python3 tools/atelier/test_arrow_library.py
          python3 tools/atelier/test_arrow_reference_library.py
          python3 tools/atelier/build_assets.py
          git diff --exit-code -- app-android/src/main/assets/atelier/models
          python3 tools/atelier/build_arrow_reference_library.py
          git diff --exit-code -- app-android/src/main/assets/atelier/arrow-reference-library
      - name: Assemble signed release artifacts
        env:
          CROCODYL_RELEASE_STORE_FILE: app-android/release.keystore
          CROCODYL_RELEASE_STORE_PASSWORD: ${{ secrets.CROCODYL_RELEASE_STORE_PASSWORD }}
          CROCODYL_RELEASE_KEY_ALIAS: ${{ secrets.CROCODYL_RELEASE_KEY_ALIAS }}
          CROCODYL_RELEASE_KEY_PASSWORD: ${{ secrets.CROCODYL_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app-android:bundleRelease :app-android:assembleRelease -PwithAndroid --no-daemon -PcrocodylVersionName="${{ steps.ver.outputs.version }}" -PcrocodylVersionCode="${{ steps.ver.outputs.version_code }}"
      - name: Run on-device smoke tests against signed minified release
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        env:
          CROCODYL_RELEASE_STORE_FILE: app-android/release.keystore
          CROCODYL_RELEASE_STORE_PASSWORD: ${{ secrets.CROCODYL_RELEASE_STORE_PASSWORD }}
          CROCODYL_RELEASE_KEY_ALIAS: ${{ secrets.CROCODYL_RELEASE_KEY_ALIAS }}
          CROCODYL_RELEASE_KEY_PASSWORD: ${{ secrets.CROCODYL_RELEASE_KEY_PASSWORD }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew :app-android:connectedReleaseAndroidTest -PwithAndroid -PcrocodylInstrumentRelease=true --no-daemon -PcrocodylVersionName="${{ steps.ver.outputs.version }}" -PcrocodylVersionCode="${{ steps.ver.outputs.version_code }}"
      - name: Run minified release smoke tests
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r app-android/build/outputs/apk/release/app-android-release.apk
            adb logcat -c
            adb shell am start -W -n xyz.mdhv.formanalyser/.app.MainActivity
            sleep 3
            test -n "$(adb shell pidof xyz.mdhv.formanalyser)"
            if adb logcat -d -v brief | grep -Eiq 'FATAL EXCEPTION|Process: xyz.mdhv.formanalyser|NoClassDefFoundError|ClassNotFoundException'; then
              echo 'Minified release launch emitted a fatal app-process error.' >&2
              adb logcat -d -v brief >&2
              exit 1
            fi
      - name: Verify signed release artifacts
        env:
          EXPECTED_VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          EXPECTED_VERSION_NAME: ${{ steps.ver.outputs.version }}
          EXPECTED_CERT_SHA256: ${{ secrets.CROCODYL_RELEASE_CERT_SHA256 }}
        run: |
          tools/release/verify_android_release.sh "$(find app-android/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)" "$(find app-android/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
      - name: Rename release artifacts
        # Release outputs live under the release variant; keep the public filenames stable.
        run: |
          cp app-android/build/outputs/apk/release/*.apk "crocodyl-${{ steps.ver.outputs.version }}.apk"
          cp app-android/build/outputs/bundle/release/*.aab "crocodyl-${{ steps.ver.outputs.version }}.aab"
      - name: Generate release checksums
        run: |
          sha256sum "crocodyl-${{ steps.ver.outputs.version }}.apk" "crocodyl-${{ steps.ver.outputs.version }}.aab" > "crocodyl-${{ steps.ver.outputs.version }}-SHA256SUMS.txt"
      # Public no-login download links on the Release page (APK for direct testing, AAB for Play).
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: crocodyl-*.apk,crocodyl-*.aab,crocodyl-*-SHA256SUMS.txt
          generate_release_notes: true
      - name: Remove signing material
        if: ${{ always() }}
        run: rm -f app-android/release.keystore
