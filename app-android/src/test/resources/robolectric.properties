# Pins the Robolectric-simulated Android SDK level for every test in this module.
#
# compileSdk/targetSdk here is 35 (see build.gradle.kts); Robolectric would otherwise default to
# that from the merged manifest. 34 is pinned instead: it is the most broadly and stably supported
# level across recent Robolectric releases, and none of these tests (Room migrations, the
# PrivacyRegistry reflection guard, ViewModel tests) exercise anything API-35-specific, so there is
# nothing to gain from chasing the newest shadow set and a real, if hard-to-diagnose-from-here, risk
# in doing so: this file cannot run Robolectric to find out whether a given API-35 shadow gap would
# bite one of these tests, so the safer, more conservative level is the honest choice.
sdk=34
